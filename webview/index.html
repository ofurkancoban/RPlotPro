<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src ${webview.cspSource} 'unsafe-inline'; script-src ${webview.cspSource} 'unsafe-inline'; connect-src ws://localhost:* ws://127.0.0.1:* blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R Plot Viewer</title>
    <link rel="stylesheet" type="text/css" href="${styleUri}">
</head>
<body>
    <div class="header">
        <div class="toolbar-group">
            <div class="connection-status" style="margin-left: 0; padding-left: 0; border-left: none;">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">...</span>
            </div>
            
            <div class="separator"></div>

            <button class="icon-btn" onclick="nextPlot()" id="nextBtn" title="Next Plot" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-big-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M20 15h-8v3.586a1 1 0 0 1 -1.707 .707l-6.586 -6.586a1 1 0 0 1 0 -1.414l6.586 -6.586a1 1 0 0 1 1.707 .707v3.586h8a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1z" /></svg>
            </button>
            <button class="icon-btn" onclick="previousPlot()" id="prevBtn" title="Previous Plot" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-big-right"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 9h8v-3.586a1 1 0 0 1 1.707 -.707l6.586 6.586a1 1 0 0 1 0 1.414l-6.586 6.586a1 1 0 0 1 -1.707 -.707v-3.586h-8a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1z" /></svg>
            </button>
            
            <div class="separator"></div>
            
            <button class="icon-btn" onclick="copyToClipboard()" id="copyBtn" title="Copy to Clipboard" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-copy"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg>
            </button>
            <button class="icon-btn" onclick="exportPlot()" id="exportBtn" title="Save Plot" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-device-floppy"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" /><path d="M12 14m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M14 4l0 4l-6 0l0 -4" /></svg>
            </button> 

            <div class="separator"></div>

            <button class="icon-btn" onclick="toggleZoom()" id="zoomBtn" title="Zoom">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-zoom-pan"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M17 17l-2.5 -2.5" /><path d="M10 4l2 -2l2 2" /><path d="M20 10l2 2l-2 2" /><path d="M4 10l-2 2l2 2" /><path d="M10 20l2 2l2 -2" /></svg>
            </button>
            
            <button class="icon-btn" onclick="toggleAspectRatio()" id="aspectBtn" title="Aspect Ratio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-ruler-2"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M17 3l4 4l-14 14l-4 -4z" /><path d="M16 7l-1.5 -1.5" /><path d="M13 10l-1.5 -1.5" /><path d="M10 13l-1.5 -1.5" /><path d="M7 16l-1.5 -1.5" /></svg>
            </button>

            <button class="icon-btn" onclick="toggleAnnotationMode()" id="annotateBtn" title="Annotate Plot">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-writing"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M20 17v-12c0 -1.121 -.879 -2 -2 -2s-2 .879 -2 2v12l2 2l2 -2" /><path d="M16 7h4" /><path d="M18 19h-13a2 2 0 1 1 0 -4h4a2 2 0 1 0 0 -4h-3" /></svg>
            </button>

            <div class="separator"></div>

            <button class="icon-btn" onclick="toggleSplitView()" id="splitBtn" title="Compare Plots (Split View)" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-columns-2"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 3m0 1a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v16a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1z" /><path d="M12 3l0 18" /></svg>
            </button>

            <div class="separator"></div>

            <button class="icon-btn" onclick="openInNewWindow()" id="newWindowBtn" title="Open plots gallery in new window" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-window-maximize"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 16m0 1a1 1 0 0 1 1 -1h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1z" /><path d="M4 12v-6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-6" /><path d="M12 8h4v4" /><path d="M16 8l-5 5" /></svg>
            </button>

            <div style="flex: 1"></div>

            <span style="font-size:11px; color:var(--text-secondary); min-width:30px; text-align:center; margin-right: 8px;" id="plotInfo"></span>

            <button class="icon-btn" onclick="toggleDarkMode()" id="darkModeBtn" title="Toggle Dark Mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-circle"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /></svg>
            </button>

            <div class="separator"></div>
            
            <button class="icon-btn" onclick="toggleFavoriteFilter()" id="favoriteFilterBtn" title="Show Favorites Only" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-star"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z" /></svg>
            </button>

            <button class="icon-btn" onclick="clearAllPlots()" id="clearBtn" title="Clear All" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-trash"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7l16 0" /><path d="M10 11l0 6" /><path d="M14 11l0 6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
            </button>

            <button class="icon-btn" onclick="toggleSidebar()" id="sidebarToggle" title="Toggle Sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-layout-sidebar-right-collapse"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" /><path d="M15 4v16" /><path d="M9 10l2 2l-2 2" /></svg>
            </button>
        </div>
    </div>

    <div class="main-layout">
        <div class="plot-viewer">
            <div class="zoom-notification" id="zoomNotification"></div>
            <div class="zoom-notification" id="aspectNotification"></div>
            <!-- Annotation Palette -->
            <div id="drawPalette" class="draw-palette" style="display: none;">
                <div class="palette-handle" id="paletteHandle"></div>
                <button class="tool-btn active" id="tool-pencil" onclick="setDrawTool('pencil')" title="Pencil">✎</button>
                <button class="tool-btn" id="tool-arrow" onclick="setDrawTool('arrow')" title="Arrow">↗</button>
                <button class="tool-btn" id="tool-text" onclick="setDrawTool('text')" title="Text">T</button>
                <div class="palette-sep"></div>
                <div class="color-picker">
                    <div class="color-swatch active" id="color-red" style="background: #ff4757;" onclick="setDrawColor('#ff4757')"></div>
                    <div class="color-swatch" id="color-green" style="background: #2ed573;" onclick="setDrawColor('#2ed573')"></div>
                    <div class="color-swatch" id="color-blue" style="background: #1e90ff;" onclick="setDrawColor('#1e90ff')"></div>
                    <div class="color-swatch" id="color-orange" style="background: #ffa502;" onclick="setDrawColor('#ffa502')"></div>
                    <div class="color-swatch" id="color-white" style="background: #ffffff;" onclick="setDrawColor('#ffffff')"></div>
                    <div class="color-swatch-custom-container" title="Custom Color">
                        <input type="color" id="customColorPicker" style="display: none;">
                        <div class="color-swatch" id="color-custom" style="display: flex; align-items: center; justify-content: center; overflow: hidden; background: #ffffff; cursor: pointer; position: relative;" onclick="triggerCustomColor()">
                            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; pointer-events: none;">
                                <defs>
                                    <filter id="paletteBlur" color-interpolation-filters="linear" x="-50%" y="-50%" width="200%" height="200%">
                                        <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
                                    </filter> 
                                    <mask id="paletteCircleMask">
                                        <circle cx="50" cy="50" r="50" fill="white" />
                                    </mask>
                                </defs>
                                <g mask="url(#paletteCircleMask)" filter="url(#paletteBlur)">
                                    <rect x="-10" width="110" height="110" fill="blue"/>
                                    <rect x="50" width="60" height="110" fill="yellow"/>
                                    <polygon points="50,50, 60,110, 40,110" fill="#0f8"/>
                                    <polygon points="0,0, 100,0, 100,20, 50,50, 0,20" fill="red"/>
                                    <polygon points="0,10, 50,50, 0,30" fill="#f0f"/>
                                    <polygon points="100,10, 100,30, 50,50" fill="#f80"/>
                                </g>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="palette-sep"></div>

                <button class="tool-btn" onclick="undoAnnotation()" id="undoBtn" title="Undo (Ctrl+Z)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-back-up"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 14l-4 -4l4 -4" /><path d="M5 10h11a4 4 0 1 1 0 8h-1" /></svg>
                </button>
                <button class="tool-btn" onclick="redoAnnotation()" id="redoBtn" title="Redo (Ctrl+Y)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-forward-up"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 14l4 -4l-4 -4" /><path d="M19 10h-11a4 4 0 1 0 0 8h1" /></svg>
                </button>
                <button class="tool-btn" onclick="clearAnnotations()" title="Clear All">🗑</button>
                <div class="palette-sep"></div>
                <button class="tool-btn" onclick="togglePaletteOrientation()" id="orientationBtn" title="Toggle Orientation">
                    <svg viewBox="0 0 512 512" width="20" height="20" fill="currentColor">
                        <g>
                            <g>
                                <path d="M490.667,149.333H45.347c9.456-36.835,42.838-64,82.653-64h12.497l-6.248,6.248c-8.331,8.331-8.331,21.839,0,30.17 c8.331,8.331,21.839,8.331,30.17,0l42.667-42.667c0.497-0.497,0.967-1.02,1.413-1.563c0.202-0.246,0.378-0.506,0.568-0.759 c0.228-0.304,0.463-0.601,0.674-0.917c0.203-0.304,0.379-0.619,0.565-0.931c0.171-0.286,0.35-0.565,0.507-0.859 c0.17-0.318,0.314-0.645,0.467-0.97c0.145-0.306,0.298-0.608,0.428-0.922c0.13-0.315,0.236-0.637,0.35-0.957 c0.121-0.337,0.25-0.669,0.354-1.013c0.097-0.32,0.168-0.645,0.249-0.969c0.089-0.351,0.187-0.698,0.258-1.056 c0.074-0.375,0.118-0.753,0.172-1.13c0.044-0.311,0.104-0.618,0.135-0.933c0.138-1.4,0.138-2.811,0-4.211 c-0.031-0.315-0.09-0.621-0.135-0.933c-0.054-0.377-0.098-0.756-0.173-1.13c-0.071-0.358-0.169-0.704-0.258-1.055 c-0.081-0.324-0.152-0.649-0.249-0.969c-0.104-0.344-0.233-0.677-0.354-1.013c-0.115-0.32-0.22-0.642-0.35-0.957 c-0.13-0.314-0.283-0.615-0.428-0.921c-0.153-0.325-0.297-0.653-0.468-0.971c-0.157-0.293-0.336-0.572-0.506-0.857 c-0.186-0.312-0.363-0.628-0.566-0.932c-0.211-0.315-0.446-0.612-0.673-0.915c-0.19-0.254-0.366-0.514-0.569-0.761 c-0.443-0.54-0.91-1.059-1.403-1.552c-0.004-0.004-0.006-0.008-0.01-0.011L164.418,6.248c-8.331-8.331-21.839-8.331-30.17,0 c-8.331,8.331-8.331,21.839,0,30.17l6.248,6.248H128c-70.747,0-128,57.253-128,128v170.667c0,11.782,9.551,21.333,21.333,21.333 h445.32c-9.456,36.835-42.838,64-82.653,64h-12.497l6.248-6.248c8.331-8.331,8.331-21.839,0-30.17 c-8.331-8.331-21.839-8.331-30.17,0l-42.667,42.667c-0.008,0.008-0.014,0.016-0.021,0.023c-0.488,0.49-0.952,1.004-1.392,1.54 c-0.204,0.248-0.38,0.509-0.571,0.764c-0.226,0.302-0.461,0.598-0.671,0.913c-0.204,0.304-0.38,0.62-0.566,0.932 c-0.17,0.285-0.349,0.564-0.506,0.857c-0.17,0.318-0.315,0.646-0.468,0.971c-0.145,0.306-0.297,0.607-0.428,0.921 c-0.13,0.315-0.236,0.637-0.35,0.957c-0.121,0.337-0.25,0.669-0.355,1.014c-0.097,0.32-0.168,0.645-0.249,0.968 c-0.089,0.351-0.187,0.698-0.258,1.056c-0.074,0.375-0.118,0.753-0.172,1.13c-0.044,0.311-0.104,0.618-0.135,0.933 c-0.138,1.4-0.138,2.811,0,4.211c0.031,0.315,0.09,0.621,0.135,0.932c0.054,0.378,0.098,0.756,0.173,1.13 c0.071,0.358,0.169,0.704,0.258,1.055c0.081,0.324,0.152,0.649,0.249,0.969c0.104,0.344,0.233,0.677,0.354,1.013 c0.115,0.32,0.22,0.642,0.35,0.957c0.13,0.314,0.283,0.616,0.428,0.922c0.153,0.325,0.297,0.652,0.467,0.97 c0.157,0.294,0.337,0.573,0.507,0.859c0.186,0.312,0.362,0.627,0.565,0.931c0.211,0.315,0.446,0.612,0.673,0.915 c0.19,0.254,0.367,0.515,0.57,0.762c0.443,0.539,0.909,1.058,1.402,1.551c0.004,0.004,0.007,0.008,0.011,0.012l42.667,42.667 c8.331,8.331,21.839,8.331,30.17,0c8.331-8.331,8.331-21.839,0-30.17l-6.248-6.248H384c70.747,0,128-57.253,128-128V170.667 C512,158.885,502.449,149.333,490.667,149.333z M42.667,192h426.667v128H42.667V192z"/>
                            </g>
                        </g>
                    </svg>
                </button>
            </div>

            <div class="plot-container" id="plotContainer">

                <div class="empty-state" id="emptyState" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; overflow: hidden;">
                    <div class="content-wrapper" style="position: absolute; top: 45%; left: 45%; transform: translate(-50%, -50%); z-index: 10; text-align: center; scale: 65%;">
                        <div class="animated-plot" style="margin-bottom: 20px;">
                            <div class="axis axis-x"></div>
                            <div class="axis axis-y"></div>
                            <div class="plot-line">
                                <svg viewBox="0 0 240 120" preserveAspectRatio="none">
                                    <path class="plot-path" d="M 0 75 Q 40 25, 80 50 T 160 30 T 240 25"></path>
                                </svg>
                            </div>
                            <div class="plot-dots">
                                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                            </div>
                        </div>
                        <div style="text-align: center;">
                            <h3 style="margin-bottom: 5px; font-weight: 400; font-size: 24px;">No Plot<div class="impulse-dot"></div></h3>
                            <p style="font-size: 16px; opacity: 0.7;">Waiting for plot output...</p>
                        </div>
                    </div>
                </div>
                <div class="media-wrapper" id="mainMediaWrapper" style="display: none;">
                    <img id="plotImage" draggable="false" />
                    <canvas id="annotationCanvas" class="annotation-layer"></canvas>
                </div>
                
                <div id="splitViewContainer" class="split-view-container" style="display: none;">
                    <div id="leftPane" class="split-pane focused" onclick="focusPane('left')">
                        <div class="media-wrapper" id="leftMediaWrapper">
                            <img id="leftPlot" draggable="false" />
                            <canvas id="leftAnnotationCanvas" class="annotation-layer"></canvas>
                        </div>
                        <div class="pane-label" id="leftPaneLabel">Plot A</div>
                    </div>
                    <div id="splitDivider" class="split-divider">
                        <div class="divider-handle"></div>
                    </div>
                    <div id="rightPane" class="split-pane" onclick="focusPane('right')">
                        <div class="media-wrapper" id="rightMediaWrapper">
                            <img id="rightPlot" draggable="false" />
                            <canvas id="rightAnnotationCanvas" class="annotation-layer"></canvas>
                        </div>
                        <div class="pane-label" id="rightPaneLabel">Plot B</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="plot-list" id="plotList">
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">Plot Note</div>
            <textarea class="modal-textarea" id="noteTextarea" placeholder="Add a note for this plot..."></textarea>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeNoteModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="saveNote()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="textModal">
        <div class="modal-content">
            <div class="modal-header">Annotation Text</div>
            <input type="text" class="modal-input" id="textInput" placeholder="Enter text here..." autocomplete="off">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeTextModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmTextAnnotation()">Add Text</button>
            </div>
        </div>
    </div>

    <div id="debugLog" style="display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 200px; background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace; font-size: 10px; overflow-y: auto; z-index: 10000; padding: 10px; border-top: 1px solid #0f0;">
